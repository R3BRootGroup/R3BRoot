# Requires following secrets and variables:
#
# variables:
# - DOCKER_REPO: repository to be pushed to.
# - DOCKER_USERNAME: the user name of the repository owner.
# - SYLABS_USERNAME: the user name of sylab repo owner
#
# secrets:
# - DOCKER_TOKEN: access token to dockerhub
# - SYLABS_TOKEN: access token to sylab server

name: deploy-container

on:
  push:
    branches: [ edwin_dev ]
  workflow_dispatch:


jobs:
  docker-build:
    strategy:
      fail-fast: false
      matrix:
        repo: 
          - 'r3bdev:r3broot'
          - 'r3bdev:r3broot-arm'
        include:
          - repo: 'r3bdev:r3broot'
            build-repo: 'r3bdev:fedora-latest'
            build-env: 'ubuntu-latest'
          - repo: 'r3bdev:r3broot-arm'
            build-repo: 'r3bdev:fedora-latest-arm'
            build-env: 'ubuntu-24.04-arm'

    runs-on: ${{ matrix.build-env }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: util/container
          tags: ${{ vars.DOCKER_USERNAME }}/${{ matrix.repo }}
          build-args: |
            BUILD_REPO=${{ matrix.build-repo }}
            THREAD_NUM=4 
            R3B_BRNAME=${{ github.head_ref || github.ref_name }}


  apptainer-build:
    runs-on: self-hosted
    continue-on-error: true
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: build apptainer and push
        run: |
          set -e
          apptainer remote logout SylabsCloud
          mkdir -p ${{ github.workspace }}/tmp
          # apptainer remote add --no-login SylabsCloud cloud.sycloud.io
          echo "${{ secrets.SYLABS_TOKEN }}" | singularity remote login
          apptainer remote status
          apptainer delete -F library://${{ vars.SYLABS_USERNAME }}/r3bdev/${image_tag} || true
          apptainer build --notest -F neuland.sif ./util/container/neuland.def
          apptainer sign --keyidx 0 neuland.sif
          apptainer push -D "neuland cli" -U neuland.sif library://${{ vars.SYLABS_USERNAME }}/r3bdev/${image_tag}
        shell: bash
        env:
          image_tag: 'neuland:latest'
          APPTAINER_TMPDIR: ${{ github.workspace }}/tmp

      - name: clean up
        if: success() || failure()
        run: |
          apptainer remote logout SylabsCloud
          apptainer cache clean -f
          rm -rf ${{ github.workspace }}/tmp
          df -h
