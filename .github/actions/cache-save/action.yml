name: cache-save
description: 'steps to cache R3BRoot and ucesb'

inputs:
  cache-name:
    description: 'repository name'
    required: true

runs:
  using: composite
  steps:
    - name: cache ucesb
      id: cache-ucesb
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ env.UCESB_DIR }}
          ${{ github.workspace }}/build/_deps
        key: build-deps-${{ matrix.os }}

    - name: cache atima
      id: cache-atima
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ env.ATIMA_DIR }}
          ${{ env.ATIMAPATH }}
        key: atima-${{ matrix.os }}

    - name: cache r3b
      if: matrix.save != 'false'
      id: cache-r3b
      uses: actions/cache/save@v5
      with:
        path: .ccache
        key: r3b-build-${{ inputs.cache-name }}-${{ matrix.os }}
