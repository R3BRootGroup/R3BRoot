name: build-steps-with-fairroot
description: Steps to set environment variables and build R3BRoot
inputs:
  build-needed:
    description: 'build process is needed'
    required: false
    default: 'true'
runs:
  using: "composite"
  steps:
    - name: Add other repos
      if: ${{ matrix.url }}
      run: |
        cd $GITHUB_WORKSPACE
        for url in ${{ matrix.url }};
        do
          git clone -b dev ${url}
        done
      shell: bash

    - name: Configure CMake
      run: |
        git config --global --add safe.directory $GITHUB_WORKSPACE
        echo "cacheSHA=$([[ ${{github.event_name}} = 'push' ]] && git rev-parse --short HEAD || git rev-parse --short HEAD^)" >> $GITHUB_ENV
        git submodule update --init --recursive
        cmake --preset ${{ matrix.preset }} . -C "$GITHUB_WORKSPACE/cmake/CI_CD/configure_options.cmake"
      shell: bash

    - name: Build
      if: ${{ inputs.build-needed == 'true' }}
      run: cmake --build ./build -- -j${NUM_THREADS}
      shell: bash
